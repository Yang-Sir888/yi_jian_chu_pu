services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_MODEL_CALLS_PER_DAY: 100
      MAX_STORAGE_MB: 1024
    volumes:
      - guoyun-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
volumes:
  guoyun-data:
